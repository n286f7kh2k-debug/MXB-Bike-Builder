name: Repair Theme Art Resource

on:
  push:
    branches: [native-rebuild]
    paths:
      - '.github/workflows/repair-theme-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native rebuild
        uses: actions/checkout@v4
        with:
          ref: native-rebuild

      - name: Rebuild clean reference header image
        shell: bash
        run: |
          set -euo pipefail
          cat .github/theme_chunks/part00.b64 \
              .github/theme_chunks/part01.b64 \
              .github/theme_chunks/part02.b64 \
              .github/theme_chunks/part03.b64 \
              .github/theme_chunks/part04.b64 \
              .github/theme_chunks/part05.b64 \
              .github/theme_chunks/part06.b64 > /tmp/reference-header.b64

          test "$(wc -c < /tmp/reference-header.b64 | tr -d ' ')" = "25816"
          mkdir -p native-race-day-live/src/MXBRaceDayLive.Profile/Assets
          base64 --decode /tmp/reference-header.b64 > native-race-day-live/src/MXBRaceDayLive.Profile/Assets/reference-header.jpg

          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('native-race-day-live/src/MXBRaceDayLive.Profile/Assets/reference-header.jpg')
          data = p.read_bytes()
          print('Header bytes:', len(data))
          print('Header SHA256:', hashlib.sha256(data).hexdigest())
          if len(data) < 10000:
              raise SystemExit('reference header is unexpectedly small')
          if not data.startswith(b'\xff\xd8\xff'):
              raise SystemExit('reference header does not begin with JPEG SOI')
          if not data.rstrip().endswith(b'\xff\xd9'):
              raise SystemExit('reference header does not end with JPEG EOI')
          PY

      - name: Replace malformed ThemeArt loader
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('native-race-day-live/src/MXBRaceDayLive.Profile')
          theme = root / 'ThemeArt.cs'
          theme.write_text('''using System.IO;
          using System.Windows;
          using System.Windows.Media;
          using System.Windows.Media.Imaging;

          namespace MXBRaceDayLive.Profile;

          internal static class ThemeArt
          {
              private const string ResourceName = "MXBRaceDayLive.Profile.Assets.reference-header.jpg";
              private static readonly Lazy<ImageSource> HeaderImage = new(LoadImage, LazyThreadSafetyMode.ExecutionAndPublication);

              public static ImageBrush HeaderBrush() => NewBrush(new Rect(0.00, 0.00, 1.00, 1.00));
              public static ImageBrush RiderBrush() => NewBrush(new Rect(0.25, 0.00, 0.45, 1.00));
              public static ImageBrush LiveBrush() => NewBrush(new Rect(0.57, 0.00, 0.43, 1.00));
              public static ImageBrush LogoBrush() => NewBrush(new Rect(0.00, 0.00, 0.38, 1.00));

              private static ImageBrush NewBrush(Rect viewbox)
              {
                  var brush = new ImageBrush(HeaderImage.Value)
                  {
                      Stretch = Stretch.UniformToFill,
                      AlignmentX = AlignmentX.Center,
                      AlignmentY = AlignmentY.Center,
                      ViewboxUnits = BrushMappingMode.RelativeToBoundingBox,
                      Viewbox = viewbox
                  };
                  brush.Freeze();
                  return brush;
              }

              private static ImageSource LoadImage()
              {
                  using var stream = typeof(ThemeArt).Assembly.GetManifestResourceStream(ResourceName)
                      ?? throw new InvalidOperationException($"Theme image resource was not found: {ResourceName}");
                  var bitmap = new BitmapImage();
                  bitmap.BeginInit();
                  bitmap.CacheOption = BitmapCacheOption.OnLoad;
                  bitmap.StreamSource = stream;
                  bitmap.EndInit();
                  bitmap.Freeze();
                  return bitmap;
              }
          }
          '''.replace('          ', ''), encoding='utf-8')

          project_path = root / 'MXBRaceDayLive.Profile.csproj'
          project = project_path.read_text(encoding='utf-8')
          project = re.sub(r'<Version>[^<]+</Version>', '<Version>1.0.19</Version>', project, count=1)
          if 'Assets\\reference-header.jpg' not in project and 'Assets/reference-header.jpg' not in project:
              marker = '  <ItemGroup>\n    <ProjectReference Include="../MXBRaceDayLive.Contracts/MXBRaceDayLive.Contracts.csproj" />\n  </ItemGroup>'
              replacement = marker + '\n  <ItemGroup>\n    <EmbeddedResource Include="Assets\\reference-header.jpg" />\n  </ItemGroup>'
              if marker not in project:
                  raise SystemExit('Could not find project ItemGroup insertion point')
              project = project.replace(marker, replacement, 1)
          project_path.write_text(project, encoding='utf-8')

      - name: Verify repaired source
        shell: bash
        run: |
          set -euo pipefail
          test -s native-race-day-live/src/MXBRaceDayLive.Profile/Assets/reference-header.jpg
          grep -q '<Version>1.0.19</Version>' native-race-day-live/src/MXBRaceDayLive.Profile/MXBRaceDayLive.Profile.csproj
          grep -q 'EmbeddedResource' native-race-day-live/src/MXBRaceDayLive.Profile/MXBRaceDayLive.Profile.csproj
          grep -q 'GetManifestResourceStream' native-race-day-live/src/MXBRaceDayLive.Profile/ThemeArt.cs
          ! grep -q 'FromBase64String' native-race-day-live/src/MXBRaceDayLive.Profile/ThemeArt.cs

      - name: Commit repaired theme asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-race-day-live/src/MXBRaceDayLive.Profile/ThemeArt.cs \
                  native-race-day-live/src/MXBRaceDayLive.Profile/MXBRaceDayLive.Profile.csproj \
                  native-race-day-live/src/MXBRaceDayLive.Profile/Assets/reference-header.jpg
          git commit -m 'Fix theme image runtime crash and bump profile v1.0.19'
          git push origin HEAD:native-rebuild
