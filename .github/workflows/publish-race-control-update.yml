name: Publish MXB Race Control update

on:
  push:
    paths:
      - race-control/release-request.json

permissions:
  contents: write

jobs:
  build-mxb-binaries:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build branded launcher and recovery tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = 'race-control/launcher/rdl_launcher.py'
          $recovery = 'race-control/recovery/rdl_recovery.py'
          $version = 'race-control/launcher/version_info.txt'
          $icon = 'race-control/launcher/mxb_race_day_live.ico'
          foreach ($p in @($launcher,$recovery,$version,$icon)) {
            if (-not (Test-Path $p)) { throw "missing build input: $p" }
          }
          New-Item -ItemType Directory -Force -Path race-control/staging | Out-Null
          python -m pip install --disable-pip-version-check pyinstaller pillow
          Remove-Item 'race-control/staging/MXB Race Day Live.exe' -Force -ErrorAction SilentlyContinue
          Remove-Item 'race-control/staging/MXB Race Day Live Recovery.exe' -Force -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name 'MXB Race Day Live' `
            --version-file $version `
            --icon $icon `
            --distpath race-control/staging `
            $launcher
          if ($LASTEXITCODE -ne 0) { throw "launcher PyInstaller failed with exit code $LASTEXITCODE" }
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name 'MXB Race Day Live Recovery' `
            --icon $icon `
            --distpath race-control/staging `
            $recovery
          if ($LASTEXITCODE -ne 0) { throw "recovery PyInstaller failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'race-control/staging/MXB Race Day Live.exe')) { throw 'branded launcher output missing' }
          if (-not (Test-Path 'race-control/staging/MXB Race Day Live Recovery.exe')) { throw 'recovery executable output missing' }
          Copy-Item $icon 'race-control/staging/rdl-launcher.ico' -Force

      - name: Validate recovery binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'race-control/staging/MXB Race Day Live.exe'
          $vi = (Get-Item $out).VersionInfo
          Write-Host "ProductName=$($vi.ProductName) FileDescription=$($vi.FileDescription) OriginalFilename=$($vi.OriginalFilename) FileVersion=$($vi.FileVersion)"
          if ($vi.ProductName -ne 'MXB Race Day Live') { throw "ProductName incorrect: '$($vi.ProductName)'" }
          if ($vi.OriginalFilename -ne 'MXB Race Day Live.exe') { throw "OriginalFilename incorrect: '$($vi.OriginalFilename)'" }
          if ($vi.FileDescription -ne 'MXB Race Day Live') { throw "FileDescription incorrect: '$($vi.FileDescription)'" }
          foreach ($p in @($out,'race-control/staging/MXB Race Day Live Recovery.exe')) {
            $bytes = [System.IO.File]::ReadAllBytes($p)
            if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "$p is not a Windows PE executable" }
          }

      - name: Fetch pinned Frost EDF parser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'race-control/frost-decoder/src/edf.rs'
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          $url = 'https://raw.githubusercontent.com/Frostn1/mxb-app/2d3775a8d2931d2dd295f6211e0073293a805353/src-tauri/src/edf.rs'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $dest
          if ((Get-Content $dest -Raw) -notmatch 'EDF\\0') { throw 'Pinned Frost EDF parser did not contain the EDF signature' }

      - name: Build native MXB asset decoder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --manifest-path race-control/frost-decoder/Cargo.toml --release
          Copy-Item race-control/frost-decoder/target/release/mxb_asset_decoder.exe race-control/staging/mxb_asset_decoder.exe -Force
          if (-not (Test-Path race-control/staging/mxb_asset_decoder.exe)) { throw 'decoder executable missing' }

      - name: Upload MXB release binaries
        uses: actions/upload-artifact@v4
        with:
          name: mxb-release-binaries
          path: |
            race-control/staging/mxb_asset_decoder.exe
            race-control/staging/MXB Race Day Live.exe
            race-control/staging/MXB Race Day Live Recovery.exe
            race-control/staging/rdl-launcher.ico
          if-no-files-found: error

  publish:
    needs: build-mxb-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download MXB release binaries
        uses: actions/download-artifact@v4
        with:
          name: mxb-release-binaries
          path: race-control/staging

      - name: Assemble Race Control release
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, shutil, subprocess, sys
          from pathlib import Path
          req = json.loads(Path('race-control/release-request.json').read_text(encoding='utf-8'))
          builder = str(req.get('builder_script') or '').strip()
          if builder:
              subprocess.run([sys.executable, builder], check=True)
          else:
              version = str(req['version']).strip()
              filename = req.get('filename') or f"MXB_Race_Control_v{version.replace('.', '_')}_UPDATE.zip"
              chunks = req['chunks']
              payload = base64.b64decode(''.join(Path(x).read_text(encoding='ascii').strip() for x in chunks), validate=True)
              expected = str(req.get('sha256', '')).strip().lower()
              digest = hashlib.sha256(payload).hexdigest()
              if expected and expected != digest:
                  raise SystemExit(f'SHA-256 mismatch: expected {expected}, got {digest}')
              out = Path('race-control/releases') / filename
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(payload)
              Path('race-control/latest.json').write_text(json.dumps({
                  'version': version,
                  'url': f'https://raw.githubusercontent.com/n286f7kh2k-debug/MXB-Bike-Builder/main/race-control/releases/{filename}',
                  'sha256': digest,
                  'notes': str(req.get('notes', '')).strip(),
              }, indent=2) + '\n', encoding='utf-8')
          version = str(req['version']).strip()
          recovery_src = Path('race-control/staging/MXB Race Day Live Recovery.exe')
          if recovery_src.is_file():
              recovery_out = Path('race-control/releases') / f"MXB_Race_Day_Live_v{version.replace('.', '_')}_RECOVERY.exe"
              recovery_out.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(recovery_src, recovery_out)
              print('RECOVERY', recovery_out)
          PY

      - name: Publish release through GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64, json, os, time, urllib.error, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          request = json.loads(Path('race-control/release-request.json').read_text(encoding='utf-8'))
          version = str(request['version']).strip()
          filename = str(request.get('filename') or f"MXB_Race_Control_v{version.replace('.', '_')}_UPDATE.zip")
          release_path = f'race-control/releases/{filename}'
          manifest_path = 'race-control/latest.json'
          recovery_path = f"race-control/releases/MXB_Race_Day_Live_v{version.replace('.', '_')}_RECOVERY.exe"
          release, manifest, recovery = Path(release_path), Path(manifest_path), Path(recovery_path)
          if not release.is_file() or not manifest.is_file():
              raise SystemExit(f'assembled release files are missing for v{version}: {release_path}')
          headers = {
              'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'MXB-Race-Day-Live-Release-Bot',
          }
          def call(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(api + path, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=180) as response:
                      body = response.read()
                      return json.loads(body.decode('utf-8')) if body else {}
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(f'GitHub API {method} {path} failed: {exc.code} {exc.read().decode("utf-8", "replace")}') from exc
          entries = [
              {'path': release_path, 'mode': '100644', 'type': 'blob', 'sha': call('POST','/git/blobs',{'content':base64.b64encode(release.read_bytes()).decode('ascii'),'encoding':'base64'})['sha']},
              {'path': manifest_path, 'mode': '100644', 'type': 'blob', 'sha': call('POST','/git/blobs',{'content':manifest.read_text(encoding='utf-8'),'encoding':'utf-8'})['sha']},
          ]
          if recovery.is_file():
              entries.append({'path': recovery_path, 'mode': '100644', 'type': 'blob', 'sha': call('POST','/git/blobs',{'content':base64.b64encode(recovery.read_bytes()).decode('ascii'),'encoding':'base64'})['sha']})
          for attempt in range(1, 6):
              try:
                  head = call('GET','/git/ref/heads/main')['object']['sha']
                  base_tree = call('GET',f'/git/commits/{head}')['tree']['sha']
                  tree = call('POST','/git/trees',{'base_tree':base_tree,'tree':entries})['sha']
                  commit = call('POST','/git/commits',{'message':f'Publish MXB Race Control v{version}','tree':tree,'parents':[head]})['sha']
                  call('PATCH','/git/refs/heads/main',{'sha':commit,'force':False})
                  print(f'Published v{version} at commit {commit}')
                  break
              except Exception:
                  if attempt == 5: raise
                  time.sleep(attempt * 2)
          PY
