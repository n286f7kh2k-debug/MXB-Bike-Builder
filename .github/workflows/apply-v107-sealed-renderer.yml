name: Apply v1.0.7 sealed bike renderer

on:
  push:
    branches: [native-rebuild]
    paths:
      - '.github/workflows/apply-v107-sealed-renderer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-rebuild
          fetch-depth: 0

      - name: Fix automation type ambiguity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'native-race-day-live/src/MXBRaceDayLive.Profile/FrostBikePreviewProvider.cs'
          $source = Get-Content $path -Raw
          $updated = $source.Replace('Condition.TrueCondition', 'System.Windows.Automation.Condition.TrueCondition')
          if ($updated -eq $source) { throw 'Automation Condition insertion point was not found' }
          [System.IO.File]::WriteAllText((Resolve-Path $path), $updated)

      - name: Remove redundant explicit UI Automation references
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'native-race-day-live/src/MXBRaceDayLive.Profile/MXBRaceDayLive.Profile.csproj'
          $project = Get-Content $path -Raw
          $pattern = '\s*<ItemGroup>\s*<Reference Include="UIAutomationClient"\s*/>\s*<Reference Include="UIAutomationTypes"\s*/>\s*</ItemGroup>\s*'
          $updated = [regex]::Replace($project, $pattern, "`n")
          if ($updated -eq $project) { throw 'Explicit UI Automation reference block was not found' }
          if ($updated -notmatch '<Version>1\.0\.7</Version>') { throw 'Profile project is not v1.0.7' }
          [System.IO.File]::WriteAllText((Resolve-Path $path), $updated)

      - name: Commit compiler fixes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- native-race-day-live/src/MXBRaceDayLive.Profile/FrostBikePreviewProvider.cs native-race-day-live/src/MXBRaceDayLive.Profile/MXBRaceDayLive.Profile.csproj
          if (git diff --cached --quiet) { throw 'No v1.0.7 compiler fixes were produced' }
          git commit -m 'Fix sealed bike renderer UI Automation references'
          git push origin HEAD:native-rebuild
