name: Publish MXB Bike Builder update

on:
  push:
    paths:
      - release-request.json

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble and verify release
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          req = json.loads(Path('release-request.json').read_text(encoding='utf-8'))
          version = str(req['version']).strip()
          chunks = req['chunks']
          filename = req.get('filename') or f"MXB_Bike_Builder_v{version.replace('.', '_')}.zip"
          expected = str(req.get('sha256', '')).lower().strip()
          notes = str(req.get('notes', '')).strip()

          encoded = ''.join(Path(path).read_text(encoding='ascii') for path in chunks)
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          if expected and digest != expected:
              raise SystemExit(f'SHA-256 mismatch: expected {expected}, got {digest}')

          outdir = Path('releases')
          outdir.mkdir(parents=True, exist_ok=True)
          outfile = outdir / filename
          outfile.write_bytes(payload)

          manifest = {
              'version': version,
              'url': f'releases/{filename}',
              'sha256': digest,
              'notes': notes,
          }
          Path('latest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          for path in chunks:
              Path(path).unlink(missing_ok=True)
          PY

      - name: Commit published update
        shell: bash
        run: |
          git config user.name "MXB Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A releases latest.json staging
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          VERSION=$(python -c "import json; print(json.load(open('release-request.json'))['version'])")
          git commit -m "Publish MXB Bike Builder v${VERSION}"
          git push
