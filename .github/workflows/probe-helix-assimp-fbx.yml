name: Probe Helix Assimp FBX

on:
  workflow_dispatch:
  push:
    branches:
      - build/race-day-live-paint-creator
    paths:
      - '.github/workflows/probe-helix-assimp-fbx.yml'

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official MX Bikes rider FBX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'fbx-probe'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $zip = Join-Path $root 'rider.zip'
          Invoke-WebRequest -Uri 'https://www.mx-bikes.com/downloads/mxb_rider_templates.zip' -OutFile $zip -UseBasicParsing
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $root 'rider') -Force
          $fbx = Get-ChildItem -LiteralPath (Join-Path $root 'rider') -Recurse -Filter 'mxb_rider_template.FBX' | Select-Object -First 1
          if ($null -eq $fbx) { throw 'Official rider FBX not found' }
          "PROBE_ROOT=$root" >> $env:GITHUB_ENV
          "RIDER_FBX=$($fbx.FullName)" >> $env:GITHUB_ENV
      - name: Create .NET importer/exporter probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proj = Join-Path $env:PROBE_ROOT 'Probe'
          dotnet new console -n Probe -o $proj -f net8.0
          Push-Location $proj
          dotnet add package HelixToolkit.SharpDX.Assimp --version 3.1.2
          @'
          using System.Reflection;
          using System.Collections;

          var fbx = Environment.GetEnvironmentVariable("RIDER_FBX")!;
          var assimpAsm = Assembly.Load("HelixToolkit.SharpDX.Assimp");
          Console.WriteLine($"ASSEMBLY {assimpAsm.FullName}");

          var importerType = assimpAsm.GetTypes().First(t => t.Name == "Importer");
          var importer = Activator.CreateInstance(importerType)!;
          var load = importerType.GetMethod("Load", new[] { typeof(string) })!;
          var scene = load.Invoke(importer, new object?[] { fbx })!;
          Console.WriteLine("LOAD_RESULT " + scene.GetType().FullName);

          var root = scene.GetType().GetProperty("Root")!.GetValue(scene)!;
          void DumpNode(object node, int depth)
          {
              var t = node.GetType();
              var indent = new string(' ', depth * 2);
              Console.WriteLine($"{indent}NODE {t.FullName}");
              foreach (var p in t.GetProperties(BindingFlags.Public|BindingFlags.Instance))
              {
                  if (p.Name.Contains("Geometry", StringComparison.OrdinalIgnoreCase) || p.Name.Contains("Model", StringComparison.OrdinalIgnoreCase) || p.Name.Contains("Items", StringComparison.OrdinalIgnoreCase) || p.Name.Contains("Child", StringComparison.OrdinalIgnoreCase))
                  {
                      object? v = null; try { v = p.GetValue(node); } catch { }
                      Console.WriteLine($"{indent}  PROP {p.Name} TYPE={p.PropertyType.FullName} VALUE={v?.GetType().FullName ?? "null"}");
                      if (p.Name.Contains("Geometry", StringComparison.OrdinalIgnoreCase) && v != null)
                      {
                          foreach (var gp in v.GetType().GetProperties(BindingFlags.Public|BindingFlags.Instance))
                          {
                              if (gp.Name is "Positions" or "Indices" or "TextureCoordinates" or "Normals")
                              {
                                  object? gv = null; try { gv = gp.GetValue(v); } catch { }
                                  int count = gv is ICollection c ? c.Count : -1;
                                  Console.WriteLine($"{indent}    GEOM {gp.Name} TYPE={gp.PropertyType.FullName} COUNT={count}");
                              }
                          }
                      }
                  }
              }

              foreach (var p in t.GetProperties(BindingFlags.Public|BindingFlags.Instance))
              {
                  if (!(p.Name.Contains("Items", StringComparison.OrdinalIgnoreCase) || p.Name.Contains("Child", StringComparison.OrdinalIgnoreCase))) continue;
                  object? v = null; try { v = p.GetValue(node); } catch { }
                  if (v is IEnumerable seq && v is not string)
                  {
                      foreach (var child in seq) if (child != null && child.GetType().Name.Contains("Node")) DumpNode(child, depth + 1);
                  }
              }
          }
          DumpNode(root, 0);

          var exporterType = assimpAsm.GetTypes().FirstOrDefault(t => t.Name == "Exporter");
          Console.WriteLine("EXPORTER_TYPE " + exporterType?.FullName);
          if (exporterType != null)
          {
              foreach (var m in exporterType.GetMethods(BindingFlags.Public|BindingFlags.Instance|BindingFlags.Static|BindingFlags.DeclaredOnly))
                  Console.WriteLine("EXPORTER_METHOD " + m);
          }
          '@ | Set-Content -LiteralPath (Join-Path $proj 'Program.cs')
          dotnet run -c Release *>&1 | Tee-Object -FilePath (Join-Path $env:PROBE_ROOT 'probe.log')
          Pop-Location
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: helix-assimp-mxb-fbx-probe
          path: ${{ env.PROBE_ROOT }}/probe.log
          if-no-files-found: warn
          retention-days: 3
