name: Build Paint Creator v8 MXB Hub Layout
on:
  push:
    branches: [build/race-day-live-paint-creator]
    paths:
      - 'ci-paint-v8/**'
      - '.github/workflows/build-paint-creator-v8.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct v8 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Raw([string]$p){ ((Get-Content -Raw $p) -replace '\s','') }
          function EnsureUsing([string]$file,[string]$usingLine){$t=Get-Content -Raw $file;if($t -notmatch [regex]::Escape($usingLine)){Set-Content $file ($usingLine+"`r`n"+$t) -Encoding utf8}}
          $p01=(Raw 'ci-paint-v4-repair/p01_0.txt')+(Raw 'ci-paint-v4-repair/p01_1.txt')+(Raw 'ci-paint-v4-repair/p01_2.txt')
          $p06=(Raw 'ci-paint-v4-repair/p06_0.txt')+(Raw 'ci-paint-v4-repair/p06_1.txt')+(Raw 'ci-paint-v4-repair/p06_2.txt')
          $p09=(Raw 'ci-paint-v4-repair/p09s_0.txt')+(Raw 'ci-paint-v4-repair/p09s_1.txt')+(Raw 'ci-paint-v4-repair/p09s_2.txt')+(Raw 'ci-paint-v4-repair/p09s_3.txt')+(Raw 'ci-paint-v4-repair/p09s_4.txt')
          $p10=(Raw 'ci-paint-v4-repair/p10s_0.txt')+(Raw 'ci-paint-v4-repair/p10s_1.txt')+(Raw 'ci-paint-v4-repair/p10s_2.txt')+(Raw 'ci-paint-v4-repair/p10s_3.txt')+(Raw 'ci-paint-v4-repair/p10s_4.txt')
          $b=$p01; foreach($n in 2..5){$b+=Raw ("ci-paint-v4/part{0:D2}.txt" -f $n)}; $b+=$p06; foreach($n in 7..8){$b+=Raw ("ci-paint-v4/part{0:D2}.txt" -f $n)}; $b+=$p09+$p10
          $z=Join-Path $env:RUNNER_TEMP 'v4.zip';[IO.File]::WriteAllBytes($z,[Convert]::FromBase64String($b));if((Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4d4a4e2c81b4210530d1993da89a859ea02f3c4eb870748de3ef85dabd1bd7c9'){throw 'v4 hash mismatch'}
          $src=Join-Path $env:RUNNER_TEMP 'v8src';Expand-Archive $z $src -Force
          $z5=Join-Path $env:RUNNER_TEMP 'v5.zip';[IO.File]::WriteAllBytes($z5,[Convert]::FromBase64String((Raw 'ci-paint-v5/paint-v5-patch.zip.b64')));Expand-Archive $z5 $src -Force
          $v6='';foreach($n in 0..5){$v6+=Raw ("ci-paint-v6-clean/part{0:D2}.txt" -f $n)};$z6=Join-Path $env:RUNNER_TEMP 'v6.zip';[IO.File]::WriteAllBytes($z6,[Convert]::FromBase64String($v6));Expand-Archive $z6 $src -Force
          $v7='';foreach($n in 0..3){$v7+=Raw ("ci-paint-v7/part{0:D2}.txt" -f $n)};$z7=Join-Path $env:RUNNER_TEMP 'v7.zip';[IO.File]::WriteAllBytes($z7,[Convert]::FromBase64String($v7));Expand-Archive $z7 $src -Force
          $v8='';foreach($n in 0..3){$v8+=Raw ("ci-paint-v8/part{0:D2}.txt" -f $n)};$z8=Join-Path $env:RUNNER_TEMP 'v8.zip';[IO.File]::WriteAllBytes($z8,[Convert]::FromBase64String($v8));$h=(Get-FileHash $z8 -Algorithm SHA256).Hash.ToLowerInvariant();if($h -ne 'c452122781c1df1879e277adc90ed6d2af979427f054a09eb5abb621668a99e7'){throw "v8 hash mismatch $h"};Expand-Archive $z8 $src -Force
          $moduleRoot=Join-Path $src 'src\MXBRaceDayLive.PaintCreator'
          foreach($rel in @('Services\RiderGearSetStore.cs','Monetization\ProjectFingerprintService.cs','Services\ObjUvMeshLoader.cs','Services\IGearPreviewModelService.cs','Services\OfficialMxBikesPreviewModelService.cs','PaintCreatorModuleEntry.cs')){EnsureUsing (Join-Path $moduleRoot $rel) 'using System.IO;'}
          EnsureUsing (Join-Path $moduleRoot 'Services\OfficialMxBikesPreviewModelService.cs') 'using System.Net.Http;'
          $adapter=Join-Path $moduleRoot 'HostEntitlementAdapter.cs';$at=Get-Content -Raw $adapter;$at=$at.Replace('r.DesignName','r.ProjectName');Set-Content $adapter $at -Encoding utf8
          "SRC=$src" >> $env:GITHUB_ENV
      - name: Validate MXB Hub style flow
        shell: pwsh
        run: |
          $x=Get-Content -Raw (Join-Path $env:SRC 'src\MXBRaceDayLive.PaintCreator\RiderPaintStudioControl.xaml')
          foreach($needle in @('Step 1: Choose your gearset','Step 2: Customize Your Skin','SELECTED ELEMENT','Create Your Rider Skin','BUY &amp; INSTALL')){if(!$x.Contains($needle)){throw "missing UI requirement: $needle"}}
      - name: Compile v8 module
        shell: pwsh
        run: |
          $proj=Join-Path $env:SRC 'src\MXBRaceDayLive.PaintCreator\MXBRaceDayLive.PaintCreator.csproj'
          dotnet build $proj -c Release
          $module=Join-Path $env:RUNNER_TEMP 'module-v8';dotnet publish $proj -c Release -r win-x64 --self-contained false -o $module
          if(!(Test-Path (Join-Path $module 'MXBRaceDayLive.PaintCreator.dll'))){throw 'v8 module missing'}
          "MODULE=$module" >> $env:GITHUB_ENV
      - name: Hot swap through v6 host contracts
        shell: pwsh
        run: |
          $test=Join-Path $env:RUNNER_TEMP 'v8-hotswap';New-Item -ItemType Directory -Force $test|Out-Null
          $contracts=Join-Path $env:SRC 'src\MXBRaceDayLive.PaintCreator.Contracts\MXBRaceDayLive.PaintCreator.Contracts.csproj';$demo=Join-Path $env:SRC 'src\MXBRaceDayLive.PaintCreator.Demo\MXBRaceDayLive.PaintCreator.Demo.csproj'
          @"<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0-windows</TargetFramework><UseWPF>true</UseWPF><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup><ItemGroup><ProjectReference Include="$contracts"/><ProjectReference Include="$demo"/></ItemGroup></Project>"@|Set-Content (Join-Path $test 'HotSwap.csproj')
          @'
          using System.IO;using MXBRaceDayLive.PaintCreator.Contracts;using MXBRaceDayLive.PaintCreator.Demo;
          internal sealed class Services:IPaintCreatorHostServices{public Task<HostPaintOffer> GetExportOfferAsync(HostPaintExportRequest r,CancellationToken c=default)=>Task.FromResult(new HostPaintOffer(r.ProductId,"TEST",1m,"USD"));public Task<HostPaintAuthorization> CheckExportAsync(HostPaintExportRequest r,CancellationToken c=default)=>Task.FromResult(new HostPaintAuthorization(true,"OK"));public Task<HostPaintAuthorization> PurchaseExportAsync(HostPaintExportRequest r,CancellationToken c=default)=>Task.FromResult(new HostPaintAuthorization(true,"OK"));}
          internal static class Program{[STAThread]static void Main(){var app=new System.Windows.Application();var dir=Environment.GetEnvironmentVariable("MODULE")!;var root=Path.Combine(Path.GetTempPath(),"mxb-v8-state-"+Guid.NewGuid().ToString("N"));var s=PaintCreatorModuleSession.Load(dir,new PaintCreatorHostOptions(root,"ci"),new Services());var state=s.Module.CaptureState();if(!s.Module.ModuleVersion.StartsWith("8.0.0"))throw new Exception("wrong version "+s.Module.ModuleVersion);s.Module.RestoreState(state);Console.WriteLine("HOT_SWAP_READY VERSION="+s.Module.ModuleVersion);s.Dispose();}}
          '@|Set-Content (Join-Path $test 'Program.cs')
          $env:MODULE=$env:MODULE;dotnet run --project (Join-Path $test 'HotSwap.csproj') -c Release
      - name: Real rider viewer regression
        shell: pwsh
        run: |
          $s=Join-Path $env:RUNNER_TEMP 'v8-viewer';New-Item -ItemType Directory -Force $s|Out-Null;$lib=Join-Path $env:SRC 'src\MXBRaceDayLive.PaintCreator\MXBRaceDayLive.PaintCreator.csproj'
          @"<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0-windows</TargetFramework><UseWPF>true</UseWPF><ImplicitUsings>enable</ImplicitUsings></PropertyGroup><ItemGroup><ProjectReference Include="$lib"/></ItemGroup></Project>"@|Set-Content (Join-Path $s 'Viewer.csproj')
          'using System.IO;using MXBRaceDayLive.PaintCreator.Models;using MXBRaceDayLive.PaintCreator.Services;var root=Path.Combine(Path.GetTempPath(),"mxb-v8-viewer-"+Guid.NewGuid().ToString("N"));Directory.CreateDirectory(root);var r=await new OfficialMxBikesPreviewModelService().ResolveAsync(PaintTargetType.Rider,new PaintCreatorContext{ProjectRoot=root});if(!r.Ready||string.IsNullOrWhiteSpace(r.ObjPath))throw new Exception(r.Status);var m=ObjUvMeshLoader.Load(r.ObjPath);Console.WriteLine($"POSITIONS={m.Positions.Count} TRIANGLES={m.TriangleIndices.Count/3} UVS={m.TextureCoordinates.Count}");if(m.Positions.Count<100||m.TextureCoordinates.Count!=m.Positions.Count)throw new Exception("viewer regression");'|Set-Content (Join-Path $s 'Program.cs')
          dotnet run --project (Join-Path $s 'Viewer.csproj') -c Release
      - name: Publish v8 in app update feed
        shell: pwsh
        run: |
          $releaseDir='paint-creator/releases';New-Item -ItemType Directory -Force $releaseDir|Out-Null;$zip=Join-Path $releaseDir 'MXB_Race_Day_Live_Paint_Creator_Module_v8_0_0.zip';if(Test-Path $zip){Remove-Item $zip -Force};Compress-Archive -Path (Join-Path $env:MODULE '*') -DestinationPath $zip -Force;$sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{version='8.0.0';url='https://api.github.com/repos/n286f7kh2k-debug/MXB-Bike-Builder/contents/paint-creator/releases/MXB_Race_Day_Live_Paint_Creator_Module_v8_0_0.zip?ref=build%2Frace-day-live-paint-creator';sha256=$sha;notes='v8 rebuild based directly on supplied MXB Hub screenshots: Step 1 gearset thumbnail grid, Step 2 large 3D preview with narrow selected-element controls, simpler website-style navigation, existing hot updater and real rider viewer preserved.'}|ConvertTo-Json|Set-Content 'paint-creator/latest.json' -Encoding utf8
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add paint-creator;git commit -m 'Publish Paint Creator v8 MXB Hub layout update [skip ci]';git push origin HEAD:build/race-day-live-paint-creator
      - uses: actions/upload-artifact@v4
        with:
          name: Paint-Creator-v8-HOT-MODULE
          path: |
            paint-creator/latest.json
            paint-creator/releases/MXB_Race_Day_Live_Paint_Creator_Module_v8_0_0.zip
          retention-days: 7
