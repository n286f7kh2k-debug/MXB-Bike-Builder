name: Publish MXB Race Control update

on:
  push:
    paths:
      - race-control/release-request.json

permissions:
  contents: write

jobs:
  build-mxb-decoder:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch pinned Frost EDF parser
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'race-control/frost-decoder/src/edf.rs'
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          $url = 'https://raw.githubusercontent.com/Frostn1/mxb-app/2d3775a8d2931d2dd295f6211e0073293a805353/src-tauri/src/edf.rs'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $dest
          $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Frost EDF source SHA256: $hash"
          if ((Get-Content $dest -Raw) -notmatch 'EDF\\0') { throw 'Pinned Frost EDF parser did not contain the EDF signature' }

      - name: Build native MXB asset decoder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --manifest-path race-control/frost-decoder/Cargo.toml --release
          New-Item -ItemType Directory -Force -Path race-control/staging | Out-Null
          Copy-Item race-control/frost-decoder/target/release/mxb_asset_decoder.exe race-control/staging/mxb_asset_decoder.exe -Force
          if (-not (Test-Path race-control/staging/mxb_asset_decoder.exe)) { throw 'decoder executable missing' }

      - name: Upload MXB decoder
        uses: actions/upload-artifact@v4
        with:
          name: mxb-asset-decoder
          path: race-control/staging/mxb_asset_decoder.exe
          if-no-files-found: error

  publish:
    needs: build-mxb-decoder
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download MXB decoder
        uses: actions/download-artifact@v4
        with:
          name: mxb-asset-decoder
          path: race-control/staging

      - name: Assemble Race Control release
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, subprocess, sys
          from pathlib import Path

          req_path = Path('race-control/release-request.json')
          req = json.loads(req_path.read_text(encoding='utf-8'))
          builder = str(req.get('builder_script') or '').strip()
          if builder:
              subprocess.run([sys.executable, builder], check=True)
              raise SystemExit(0)

          version = str(req['version']).strip()
          chunks = req['chunks']
          filename = req.get('filename') or f"MXB_Race_Control_v{version.replace('.', '_')}_UPDATE.zip"
          expected = str(req.get('sha256', '')).strip().lower()
          notes = str(req.get('notes', '')).strip()

          chunk_texts = [Path(path).read_text(encoding='ascii').strip() for path in chunks]
          try:
              encoded = ''.join(chunk_texts)
              payload = base64.b64decode(encoded, validate=True)
          except Exception:
              payload = b''.join(base64.b64decode(chunk, validate=True) for chunk in chunk_texts)

          digest = hashlib.sha256(payload).hexdigest()
          if expected and digest != expected:
              raise SystemExit(f'SHA-256 mismatch: expected {expected}, got {digest}')

          outdir = Path('race-control/releases')
          outdir.mkdir(parents=True, exist_ok=True)
          outfile = outdir / filename
          outfile.write_bytes(payload)

          manifest = {
              'version': version,
              'url': f'https://raw.githubusercontent.com/n286f7kh2k-debug/MXB-Bike-Builder/main/race-control/releases/{filename}',
              'sha256': digest,
              'notes': notes,
          }
          Path('race-control/latest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          for path in chunks:
              Path(path).unlink(missing_ok=True)
          PY

      - name: Commit release
        shell: bash
        run: |
          git config user.name "MXB Race Control Update Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A race-control/releases race-control/latest.json race-control/staging
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          VERSION=$(python -c "import json; print(json.load(open('race-control/release-request.json'))['version'])")
          git commit -m "Publish MXB Race Control v${VERSION}"
          git push
