name: Fit Theme Images v1.0.20

on:
  push:
    branches: [native-rebuild]
    paths:
      - '.github/workflows/fit-theme-images-v1020.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native rebuild
        uses: actions/checkout@v4
        with:
          ref: native-rebuild
          fetch-depth: 0

      - name: Fit existing images inside their boxes
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('native-race-day-live/src/MXBRaceDayLive.Profile')

          theme_path = root / 'ThemeArt.cs'
          theme = theme_path.read_text(encoding='utf-8')
          theme_count = theme.count('Stretch = Stretch.UniformToFill,')
          if theme_count < 1:
              raise SystemExit('ThemeArt image stretch setting was not found')
          theme = theme.replace('Stretch = Stretch.UniformToFill,', 'Stretch = Stretch.Uniform,')
          theme_path.write_text(theme, encoding='utf-8')

          profile_path = root / 'ProfileHomeFeature.cs'
          profile = profile_path.read_text(encoding='utf-8')
          profile_count = profile.count('Stretch = Stretch.UniformToFill,')
          if profile_count < 1:
              raise SystemExit('No profile image brushes using UniformToFill were found')
          profile = profile.replace('Stretch = Stretch.UniformToFill,', 'Stretch = Stretch.Uniform,')
          profile_path.write_text(profile, encoding='utf-8')

          project_path = root / 'MXBRaceDayLive.Profile.csproj'
          project = project_path.read_text(encoding='utf-8')
          project = re.sub(r'<Version>[^<]+</Version>', '<Version>1.0.20</Version>', project, count=1)
          project_path.write_text(project, encoding='utf-8')

          print(f'Updated {theme_count} embedded theme brush(es) and {profile_count} profile image brush(es).')

      - name: Verify image-fit patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<Version>1.0.20</Version>' native-race-day-live/src/MXBRaceDayLive.Profile/MXBRaceDayLive.Profile.csproj
          ! grep -q 'Stretch = Stretch.UniformToFill,' native-race-day-live/src/MXBRaceDayLive.Profile/ThemeArt.cs
          ! grep -q 'Stretch = Stretch.UniformToFill,' native-race-day-live/src/MXBRaceDayLive.Profile/ProfileHomeFeature.cs
          grep -q 'Stretch = Stretch.Uniform,' native-race-day-live/src/MXBRaceDayLive.Profile/ThemeArt.cs
          grep -q 'Stretch = Stretch.Uniform,' native-race-day-live/src/MXBRaceDayLive.Profile/ProfileHomeFeature.cs

      - name: Commit v1.0.20 image fit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native-race-day-live/src/MXBRaceDayLive.Profile/ThemeArt.cs \
                  native-race-day-live/src/MXBRaceDayLive.Profile/ProfileHomeFeature.cs \
                  native-race-day-live/src/MXBRaceDayLive.Profile/MXBRaceDayLive.Profile.csproj
          git commit -m 'Fit theme images inside existing boxes and bump v1.0.20'
          git push origin HEAD:native-rebuild
